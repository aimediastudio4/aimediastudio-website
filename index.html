<!DOCTYPE html>
<html>
<head>
<title>AI Media Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
font-family: Arial;
background:#0b0b0b;
color:white;
text-align:center;
padding:50px;
}
h1{font-size:40px;}
p{font-size:20px;color:#ccc;}
.btn{
background:#00ffa6;
color:black;
padding:15px 25px;
border:none;
font-weight:bold;
border-radius:8px;
margin-top:20px;
cursor:pointer;
}
input, textarea{
width:300px;
padding:12px;
margin:8px;
border-radius:6px;
border:none;
}
form{
margin-top:30px;
}
</style>
</head>

<body>

<h1>AI Media Studio</h1>
<p>Cinematic AI Films & Documentaries</p>
<p>Autobiography • Political Campaigns • Corporate Films</p>

<form id="leadForm" action="https://aimediastudio.app.n8n.cloud/webhook/50fa2a40-8e4b-4361-ab3d-61ede8f4b20f" method="POST">
<input type="text" name="name" placeholder="Your Name" required><br>
<input type="email" name="email" placeholder="Your Email" required><br>
<textarea name="message" placeholder="Tell us about your project"></textarea><br>
<button class="btn" type="submit">Send Request</button>
</form>

<script>
document.getElementById("leadForm").addEventListener("submit", async function(e){
e.preventDefault();

const data = {
name: this.name.value,
email: this.email.value,
message: this.message.value
};

await fetch("https://aimediastudio.app.n8n.cloud/webhook/50fa2a40-8e4b-4361-ab3d-61ede8f4b20f", {
method:"POST",
headers:{"Content-Type":"application/json"},
body: JSON.stringify(data)
});

alert("Thank you! We will contact you shortly.");
this.reset();
});
</script>

</body>
</html>
